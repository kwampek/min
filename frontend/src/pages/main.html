<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIN</title>
  <link rel="stylesheet" href="main_style.css">

</head>
<body>
  <div class="container">
    <div class="left-sidebar">
      <div class="min-label">MIN</div>
      <div class="folder"><img src="icons/folder.png" alt="Folder"></div>
      <div class="folder"><img src="icons/folder.png" alt="Folder"></div>
      <div class="folder"><img src="icons/folder.png" alt="Folder"></div>
      <button class="edit-button">
        <div class="add-bbutton">+</div>
      </button>
      <div class="profile">
        <img src="icons/me.jpg">
      </div>
    </div>

    <div class="resize-bar-left"></div>

    <div class="middle-section">
      <div class="search-bar">
        <input type="text" placeholder="Search...">
      </div>

<div class="chat-item">
  <div class="chat-avatar default-avatar">
    <span class="avatar-letter">М</span>
  </div>
  <div class="chat-info">
    <div class="chat-top">
      <div class="chat-name">Мама</div>
      <div class="chat-status">
        <span class="read-status unread">✓</span>
        <span class="chat-time">10:00</span>
      </div>
    </div>
    <div class="chat-last-message">
      Привет!
    </div>
  </div>
</div>

<div class="chat-item active">
  <img class="chat-avatar" src="icons/pavlik.jpg">
  <div class="chat-info">
    <div class="chat-top">
      <div class="chat-name">Pavel Durov</div>
      <div class="chat-status">
        <span class="chat-time">00:00</span>
      </div>
    </div>
    <div class="chat-last-message">
      😢😢😢😢😢😢
    </div>
  </div>
</div>

<div class="chat-item">
  <img class="chat-avatar" src="icons/pivo.jpg" alt="Pivo">
  <div class="chat-info">
    <div class="chat-top">
      <div class="chat-name">Pivo</div>
      <div class="chat-status">
        <span class="read-status read">✓</span>
        <span class="chat-time">20:00</span>
      </div>
    </div>
    <div class="chat-last-message">
      Сбор завтра в 8!
    </div>
  </div>
</div>


    </div>

    <div class="right-section">
      <div class="chat-header">
        <div class="chat-user">
          <img src="icons/pavlik.jpg">
          <div class="info">
            <span class="name">Pavel Durov</span>
            <span class="status">online</span>
          </div>
        </div>
        <div class="actions">
          <button class="action-btn" title="Call">📞</button>
          <button class="action-btn" title="More">⋯</button>
        </div>
      </div>

      <div class="date-wrapper">
        <div class="date">
          22 октября
        </div>
      </div>

      <div class="messages">
        <div class="message other"> Don't steal my design! <span class="time">10:00</span></div>
        <div class="message mine"> Don't steal my design! <span class="time">10:01</span></div>
        <div class="message other"> 😢😢😢😢😢😢 <span class="time">10:02</span></div>
      </div>

    <div class="input-area">
      <img class="icon" src="icons/attach_icon.png" title="Attach file">
      <img class="icon" src="icons/voice_icon.png" title="Record voice">
      <input type="text" placeholder="Write a message...">
      <button title="Send">➤</button>
    </div>
    </div>
  </div>
</body>
</html>
